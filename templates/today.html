{% extends "base.html" %}
{% block title %}Today — TPDL{% endblock %}

{% block content %}

<div x-data="todayPage()" x-init="init()">

  <div class="mb-8">
    <p class="text-xs uppercase tracking-[0.2em] text-ink-3 mb-3" x-text="dateLabel"></p>
    <h1 class="text-3xl md:text-4xl font-semibold mb-3 leading-tight">
      <span x-show="data.user">Good morning<template x-if="data.user && data.user.display_name !== 'Guest'"><span x-text="', ' + data.user.display_name"></span></template>.</span>
    </h1>
    <p class="text-ink-2 max-w-2xl">Everything that needs your attention, in one place.</p>
  </div>

  <template x-if="error">
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm mb-6" x-text="error"></div>
  </template>

  <template x-if="loading">
    <div class="tpdl-card p-12 text-center text-sm text-ink-3">Loading your day…</div>
  </template>

  <template x-if="!loading && !error">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- ── Left column: action items ─────────────────────────────────── -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Drafts to validate -->
        <div class="tpdl-card overflow-hidden">
          <div class="px-6 py-4 border-b border-line flex items-center justify-between">
            <div class="flex items-center gap-2">
              <h3 class="font-semibold text-sm">Drafts waiting for you</h3>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full"
                    :style="data.pending_drafts?.count > 0 ? 'background:#fef3c7;color:#854d0e' : 'background:#dcf7e7;color:#0a3a26'"
                    x-text="data.pending_drafts?.count ?? 0"></span>
            </div>
            <a href="/marketing" class="tpdl-btn tpdl-btn--outline text-xs">Review all →</a>
          </div>
          <div class="divide-y divide-line">
            <template x-if="!data.pending_drafts?.count">
              <div class="px-6 py-8 text-center text-sm text-ink-3">All clear — nothing to validate. ✨</div>
            </template>
            <template x-for="d in data.pending_drafts?.top || []" :key="d.id">
              <div class="px-6 py-3">
                <div class="text-sm font-medium" x-text="d.topic"></div>
                <p class="text-xs text-ink-3 mt-0.5 truncate" x-text="d.preview"></p>
              </div>
            </template>
          </div>
        </div>

        <!-- Latest veille -->
        <div class="tpdl-card overflow-hidden">
          <div class="px-6 py-4 border-b border-line flex items-center justify-between">
            <h3 class="font-semibold text-sm">📡 Latest market scan — Iris</h3>
            <a href="/marketing" class="text-xs text-ink-3 hover:underline">Auto Pipeline →</a>
          </div>
          <template x-if="!data.latest_veille">
            <div class="px-6 py-8 text-center text-sm text-ink-3">
              No market scan yet — it runs monthly, or trigger it from the Auto Pipeline.
            </div>
          </template>
          <template x-if="data.latest_veille">
            <div class="divide-y divide-line">
              <template x-for="(s, i) in data.latest_veille.subjects" :key="i">
                <div class="px-6 py-3">
                  <div class="text-sm font-medium" x-text="s.subject"></div>
                  <p class="text-xs text-ink-3 mt-0.5" x-text="s.angle"></p>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- My companies -->
        <div class="tpdl-card overflow-hidden">
          <div class="px-6 py-4 border-b border-line flex items-center justify-between">
            <h3 class="font-semibold text-sm">My companies</h3>
            <a href="/intel" class="tpdl-btn tpdl-btn--outline text-xs">Market Intel →</a>
          </div>
          <template x-if="!data.my_companies?.length">
            <div class="px-6 py-8 text-center text-sm text-ink-3">
              No companies claimed yet — pick yours on the Market Intelligence page.
            </div>
          </template>
          <div class="divide-y divide-line">
            <template x-for="c in data.my_companies || []" :key="c.name">
              <div class="px-6 py-3 flex items-center justify-between">
                <span class="text-sm font-medium" x-text="c.name"></span>
                <span class="status-badge text-xs px-2 py-0.5 rounded-full bg-bg-2 text-ink-2" x-text="c.status"></span>
              </div>
            </template>
          </div>
        </div>

      </div>

      <!-- ── Right column: context ─────────────────────────────────────── -->
      <div class="space-y-6">

        <!-- Next edition countdown -->
        <div class="tpdl-card p-6" :style="data.next_edition?.days_left <= 7 ? 'border-color:#f59e0b' : ''">
          <div class="text-xs uppercase tracking-wider text-ink-3 mb-2">Next newsletter</div>
          <template x-if="data.next_edition">
            <div>
              <div class="text-2xl font-semibold" x-text="`J-${data.next_edition.days_left}`"></div>
              <div class="text-sm font-medium mt-1" x-text="data.next_edition.title"></div>
              <div class="text-xs text-ink-3 mt-1">
                <span x-text="formatDate(data.next_edition.date)"></span> ·
                <span x-text="data.next_edition.status"></span>
              </div>
              <a href="/marketing" class="tpdl-btn tpdl-btn--primary text-xs mt-3 inline-block">Open calendar</a>
            </div>
          </template>
          <template x-if="!data.next_edition">
            <p class="text-sm text-ink-3">No upcoming edition planned.</p>
          </template>
        </div>

        <!-- Generation jobs -->
        <div class="tpdl-card overflow-hidden">
          <div class="px-6 py-4 border-b border-line">
            <h3 class="font-semibold text-sm">Generation jobs</h3>
          </div>
          <template x-if="!data.jobs?.length">
            <div class="px-6 py-6 text-center text-xs text-ink-3">No jobs yet.</div>
          </template>
          <div class="divide-y divide-line">
            <template x-for="j in data.jobs || []" :key="j.id">
              <div class="px-6 py-3 flex items-center justify-between gap-2">
                <span class="text-xs font-medium truncate" x-text="j.subject"></span>
                <span class="text-xs px-2 py-0.5 rounded-full shrink-0"
                      :style="jobBadgeStyle(j.status)" x-text="j.status"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Team activity -->
        <div class="tpdl-card overflow-hidden">
          <div class="px-6 py-4 border-b border-line">
            <h3 class="font-semibold text-sm">Recent team activity</h3>
          </div>
          <template x-if="!data.recent_activity?.length">
            <div class="px-6 py-6 text-center text-xs text-ink-3">Quiet for now.</div>
          </template>
          <div class="divide-y divide-line">
            <template x-for="(a, i) in data.recent_activity || []" :key="i">
              <div class="px-6 py-2.5 flex items-center gap-3">
                <img alt="" :src="`/static/img/avatars/${a.avatar_seed}.svg`"
                     class="w-7 h-7 rounded-full bg-bg-2 shrink-0">
                <div class="flex-1 min-w-0 text-xs">
                  <span class="font-medium" x-text="a.agent"></span>
                  <span class="text-ink-3" x-text="' · ' + a.label"></span>
                </div>
                <span class="text-xs text-ink-3 shrink-0" x-text="relativeTime(a.created_at)"></span>
              </div>
            </template>
          </div>
        </div>

      </div>
    </div>
  </template>

</div>

<script src="/static/js/today.js"></script>
{% endblock %}
