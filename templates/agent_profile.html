{% extends "base.html" %}
{% block title %}{{ agent_name }} — Profile{% endblock %}

{% block head %}
<style>
  .chat-bubble-user { background: var(--tpdl-dark-ink); color: white; }
  .chat-bubble-assistant { background: var(--tpdl-bg-2); color: var(--tpdl-text); }
  .conv-item.active { background: var(--tpdl-accent-soft); border-color: #c8efd9; }
</style>
{% endblock %}

{% block content %}

<div x-data="agentProfile('{{ agent_id }}')" x-init="init()">

  <!-- Header -->
  <div class="bg-white rounded-2xl border border-line p-6 mb-6 flex items-center gap-5"
       style="background-color: {{ agent_color }}10">
    <img src="/static/img/avatars/{{ agent_avatar_seed }}.svg"
         class="w-20 h-20 rounded-full bg-white" alt="{{ agent_name }}">
    <div class="flex-1">
      <h1 class="text-2xl font-bold text-ink">{{ agent_name }}</h1>
      <p class="text-sm" style="color: {{ agent_color }}">{{ agent_role }}</p>
      <p class="text-xs text-ink-3 mt-1">
        <span x-text="conversations.length"></span> conversations ·
        <span x-text="activity.length"></span> recent activities
      </p>
    </div>
    <a href="/" class="text-sm text-ink-3 hover:text-ink px-3 py-2 rounded hover:bg-white">
      ← Back to Home
    </a>
  </div>

  <template x-if="error">
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm mb-6"
         x-text="error"></div>
  </template>

  <!-- Conversations + messages -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

    <!-- Conversations list (left) -->
    <div class="lg:col-span-1 bg-white rounded-2xl border border-line overflow-hidden">
      <div class="px-5 py-4 border-b border-line bg-bg-2">
        <h2 class="font-semibold text-ink text-sm">Conversations</h2>
      </div>
      <div class="max-h-[600px] overflow-y-auto">
        <template x-if="conversations.length === 0">
          <div class="text-sm text-ink-3 p-6 text-center">No conversations yet.</div>
        </template>
        <template x-for="conv in conversations" :key="conv.id">
          <button
            @click="selectConversation(conv.id)"
            :class="conv.id === selectedConvId ? 'conv-item active' : ''"
            class="conv-item w-full text-left px-5 py-3 border-b border-line hover:bg-bg-2 transition-colors">
            <div class="text-sm font-medium text-ink truncate" x-text="conv.title"></div>
            <div class="text-xs text-ink-3 mt-1">
              <span x-text="conv.message_count"></span> msg ·
              <span x-text="relativeTime(conv.updated_at)"></span>
            </div>
          </button>
        </template>
      </div>
    </div>

    <!-- Messages (right) -->
    <div class="lg:col-span-2 bg-white rounded-2xl border border-line overflow-hidden flex flex-col">
      <div class="px-5 py-4 border-b border-line bg-bg-2 flex items-center justify-between">
        <h2 class="font-semibold text-ink text-sm">
          <template x-if="selectedConvId">
            <span>Conversation #<span x-text="selectedConvId"></span></span>
          </template>
          <template x-if="!selectedConvId">
            <span>Pick a conversation on the left</span>
          </template>
        </h2>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-3 max-h-[600px]">
        <template x-if="loadingMessages">
          <div class="text-sm text-ink-3 text-center py-12">Loading...</div>
        </template>

        <template x-if="!loadingMessages && selectedConvId && messages.length === 0">
          <div class="text-sm text-ink-3 text-center py-12">No messages.</div>
        </template>

        <template x-for="msg in messages" :key="msg.id">
          <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
            <div class="max-w-lg">
              <div :class="msg.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-assistant'"
                   class="px-4 py-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap"
                   x-text="msg.content"></div>
              <div class="text-xs text-ink-3 mt-1 px-2"
                   :class="msg.role === 'user' ? 'text-right' : 'text-left'"
                   x-text="formatAbsolute(msg.created_at)"></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Activity feed -->
  <div class="bg-white rounded-2xl border border-line overflow-hidden">
    <div class="px-5 py-4 border-b border-line bg-bg-2">
      <h2 class="font-semibold text-ink text-sm">Activity feed</h2>
    </div>
    <div class="divide-y divide-line max-h-[400px] overflow-y-auto">
      <template x-if="activity.length === 0">
        <div class="text-sm text-ink-3 p-6 text-center">No activity yet.</div>
      </template>
      <template x-for="entry in activity" :key="entry.id">
        <div class="px-5 py-3 flex items-start gap-3">
          <div class="text-xl">
            <template x-if="entry.action === 'scanned_market'"><span>🎯</span></template>
            <template x-if="entry.action === 'scored_company'"><span>📊</span></template>
            <template x-if="entry.action === 'drafted_post'"><span>✍️</span></template>
            <template x-if="entry.action === 'wrote_email'"><span>📧</span></template>
            <template x-if="entry.action === 'structured_case_study'"><span>🎨</span></template>
            <template x-if="entry.action === 'responded_to_user'"><span>💬</span></template>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm text-ink" x-text="entry.label"></div>
            <div class="text-xs text-ink-3 mt-0.5">
              <span x-text="relativeTime(entry.created_at)"></span>
              <template x-if="entry.metadata && entry.metadata.companies">
                <span> · <span x-text="entry.metadata.companies.join(', ')"></span></span>
              </template>
              <template x-if="entry.metadata && entry.metadata.company">
                <span> · <span x-text="entry.metadata.company"></span></span>
              </template>
              <template x-if="entry.metadata && entry.metadata.topic">
                <span> · <span x-text="entry.metadata.topic"></span></span>
              </template>
              <template x-if="entry.metadata && entry.metadata.client">
                <span> · <span x-text="entry.metadata.client"></span></span>
              </template>
            </div>
          </div>
          <div class="text-xs text-ink-3" x-text="formatAbsolute(entry.created_at)"></div>
        </div>
      </template>
    </div>
  </div>

</div>

<script src="/static/js/agent_profile.js"></script>
{% endblock %}
