{% extends "base.html" %}
{% block title %}Not found — TPDL{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-20">
  <div class="text-7xl font-bold text-line-2 mb-3 select-none">404</div>
  <h1 class="text-xl font-semibold text-ink mb-2">Page not found</h1>
  <p class="text-sm text-ink-3 mb-8">
    No route matched
    <code class="px-1.5 py-0.5 bg-bg-2 rounded text-ink text-xs">{{ path }}</code>.
  </p>
  <a href="/" class="tpdl-btn tpdl-btn--dark text-sm">← Back to Home</a>
</div>
{% endblock %}
